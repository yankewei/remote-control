name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shared tests
        run: swift test

      - name: macOS build
        run: |
          set -o pipefail
          xcodebuild -project RemoteControl.xcodeproj \
            -scheme RemoteControlMac \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: iOS simulator build
        run: |
          set -o pipefail
          xcodebuild -project RemoteControl.xcodeproj \
            -scheme RemoteControl \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
