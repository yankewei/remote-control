name: RemoteControl
options:
  bundleIdPrefix: com.remotecontrol
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3BUD4GCZCQ
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  RemoteControl:
    type: application
    platform: iOS
    sources: [Shared, iOS, Assets]
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: 遥控板
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: 发现并连接同一 Wi-Fi 下的 Mac，以控制鼠标和输入文字。
        NSBonjourServices: ['_remotecontrol._tcp']
        NSMicrophoneUsageDescription: 按住说话，将语音识别为文字后发送到你的 Mac。
        NSBluetoothAlwaysUsageDescription: 通过蓝牙把鼠标移动直接发送给 Mac，减少 Wi-Fi 抖动造成的卡顿。
        NSSpeechRecognitionUsageDescription: 将中文语音转成可编辑文字。部分设备可能使用 Apple 的语音识别服务。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yankewei.remotecontrol.ios
        TARGETED_DEVICE_FAMILY: '1'
        SUPPORTS_MACCATALYST: NO
  RemoteControlMac:
    type: application
    platform: macOS
    sources: [Shared, macOS, Assets]
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: 遥控板 Mac
        LSUIElement: true
        NSLocalNetworkUsageDescription: 接收已配对 iPhone 的鼠标操作和文字。
        NSBluetoothAlwaysUsageDescription: 通过蓝牙接收已配对 iPhone 的鼠标移动，减少 Wi-Fi 抖动造成的卡顿。
        NSBonjourServices: ['_remotecontrol._tcp']
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yankewei.remotecontrol.mac
        ENABLE_APP_SANDBOX: NO
schemes:
  RemoteControl:
    build:
      targets:
        RemoteControl: all
  RemoteControlMac:
    build:
      targets:
        RemoteControlMac: all
